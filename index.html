
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penggaris Layar Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            cursor: crosshair;
            user-select: none;
            /* Mencegah highlight biru saat double click di mobile */
            -webkit-tap-highlight-color: transparent; 
        }

        /* Ruler Canvases */
        #ruler-top, #ruler-left {
            position: fixed;
            top: 0; left: 0;
            z-index: 40;
            pointer-events: none;
        }
        #ruler-top { width: 100vw; height: 40px; }
        #ruler-left { width: 40px; height: 100vh; }

        /* Measurement Overlay */
        #measure-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
        }

        /* Tracker */
        .tracker {
            position: fixed;
            background-color: rgba(56, 189, 248, 0.4); /* Sky blue 400 */
            pointer-events: none;
            z-index: 35;
        }
        #tracker-x { top: 0; width: 1px; height: 100vh; }
        #tracker-y { left: 0; width: 100vw; height: 1px; }

        /* Floating Panel */
        #control-panel {
            position: fixed;
            top: 60px; left: 60px;
            width: 340px;
            background: rgba(30, 41, 59, 0.85); /* Slate 800 */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 50;
            cursor: default;
        }

        .panel-header {
            cursor: grab;
        }
        .panel-header:active {
            cursor: grabbing;
        }

        /* Fullscreen Button */
        #btn-fullscreen {
            position: fixed;
            top: 10px;
            right: 15px;
            z-index: 60;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #btn-fullscreen:hover {
            background: rgba(30, 41, 59, 0.9);
            color: #f8fafc;
            border-color: rgba(255,255,255,0.2);
        }

        /* Custom Scrollbar for inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Floating Coordinate Label */
        #coord-label {
            position: fixed;
            background: #0284c7; /* Sky 600 */
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: monospace;
            pointer-events: none;
            z-index: 60;
            transform: translate(12px, 12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: none;
        }
    </style>
</head>
<body>

    <!-- Tombol Fullscreen -->
    <button id="btn-fullscreen" title="Layar Penuh (F11)">
        <svg class="w-5 h-5 icon-expand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        <svg class="w-5 h-5 icon-compress hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 14h4v4m0-4l-5 5m15-1v-4h-4m4 0l-5-5M10 4v4H6m4 0L5 3m9 11v-4h4m-4 0l5-5"></path></svg>
    </button>

    <!-- Rulers -->
    <canvas id="ruler-top"></canvas>
    <canvas id="ruler-left"></canvas>

    <!-- Measurement Area -->
    <canvas id="measure-canvas"></canvas>

    <!-- Crosshair Trackers -->
    <div id="tracker-x" class="tracker"></div>
    <div id="tracker-y" class="tracker"></div>

    <!-- Mouse Coordinate Label -->
    <div id="coord-label">0.00 cm</div>

    <!-- Control Panel -->
    <div id="control-panel" class="flex flex-col overflow-hidden transition-all duration-300">
        <div class="panel-header bg-slate-800/80 p-3 flex justify-between items-center border-b border-white/10">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
                <span class="font-semibold text-sm tracking-wide">Pengaturan Penggaris</span>
            </div>
            <button id="btn-minimize" class="text-slate-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>
        
        <div id="panel-content" class="p-4 flex flex-col gap-5">
            
            <!-- Satuan -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Satuan Ukuran</label>
                <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                    <button class="unit-btn flex-1 py-1.5 px-2 bg-slate-700 text-white rounded-md text-xs font-medium transition" data-unit="cm">CM</button>
                    <button class="unit-btn flex-1 py-1.5 px-2 text-slate-400 hover:text-slate-200 rounded-md text-xs font-medium transition" data-unit="inch">INCH</button>
                    <button class="unit-btn flex-1 py-1.5 px-2 text-slate-400 hover:text-slate-200 rounded-md text-xs font-medium transition" data-unit="px">PIXEL</button>
                </div>
            </div>

            <!-- Mode Akurasi -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Mode Akurasi Layar</label>
                
                <div class="space-y-3">
                    <!-- Option 1: Standar Web -->
                    <label class="flex items-start gap-3 cursor-pointer group">
                        <input type="radio" name="accuracy" value="web" checked class="mt-1 accent-sky-500">
                        <div>
                            <span class="block text-sm font-medium text-slate-200 group-hover:text-white">Standar Web (Otomatis)</span>
                            <span class="block text-xs text-slate-500 mt-0.5">Akurat untuk mendesain web / UI (96 DPI).</span>
                        </div>
                    </label>

                    <!-- Option 2: Fisik -->
                    <label class="flex items-start gap-3 cursor-pointer group">
                        <input type="radio" name="accuracy" value="physical" class="mt-1 accent-sky-500">
                        <div class="w-full">
                            <span class="block text-sm font-medium text-slate-200 group-hover:text-white">Akurasi Fisik (Manual)</span>
                            <span class="block text-xs text-slate-500 mt-0.5 mb-2">Akurat untuk mengukur benda nyata. Masukkan ukuran diagonal monitor Anda.</span>
                            
                            <div class="flex items-center gap-2 opacity-50 pointer-events-none transition-opacity" id="physical-inputs">
                                <input type="number" id="screen-size" value="14" class="w-16 bg-slate-900 border border-slate-700 rounded p-1.5 text-sm text-center focus:outline-none focus:border-sky-500">
                                <span class="text-sm text-slate-400">Inci</span>
                                <button id="btn-apply-size" class="ml-auto bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded transition">Terapkan</button>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Panduan -->
            <div class="bg-slate-900/50 rounded-lg p-3 border border-slate-700/50">
                <p class="text-xs text-slate-400 leading-relaxed">
                    <strong class="text-sky-400">Tips Profesional:</strong> Klik dan seret (drag) di area kosong layar untuk menggambar kotak pengukuran. Tekan tombol <strong class="text-slate-300">Fullscreen</strong> di pojok kanan atas untuk hasil optimal.
                </p>
            </div>
        </div>
    </div>

    <!-- Latar Belakang Instruksi (Hilang saat mulai ditarik) -->
    <div id="instruction-bg" class="fixed inset-0 flex items-center justify-center pointer-events-none -z-10 transition-opacity duration-500">
        <div class="text-center opacity-60">
            <svg class="w-16 h-16 text-slate-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            <h2 class="text-2xl font-bold text-slate-500 tracking-wider">KLIK & TARIK UNTUK MENGUKUR</h2>
        </div>
    </div>

    <script>
        // --- State Management ---
        let state = {
            unit: 'cm', // 'cm', 'inch', 'px'
            mode: 'web', // 'web', 'physical'
            ppi: 96, // Default Web DPI
            diagonalInches: 14,
            isMeasuring: false,
            measureStart: { x: 0, y: 0 },
            measureEnd: { x: 0, y: 0 }
        };

        // --- Elements ---
        const canvasTop = document.getElementById('ruler-top');
        const ctxTop = canvasTop.getContext('2d');
        const canvasLeft = document.getElementById('ruler-left');
        const ctxLeft = canvasLeft.getContext('2d');
        const measureCanvas = document.getElementById('measure-canvas');
        const ctxMeasure = measureCanvas.getContext('2d');

        const trackerX = document.getElementById('tracker-x');
        const trackerY = document.getElementById('tracker-y');
        const coordLabel = document.getElementById('coord-label');
        const instructionBg = document.getElementById('instruction-bg');

        // --- Panel Elements ---
        const panel = document.getElementById('control-panel');
        const panelHeader = document.querySelector('.panel-header');
        const panelContent = document.getElementById('panel-content');
        const btnMinimize = document.getElementById('btn-minimize');
        const physicalInputs = document.getElementById('physical-inputs');
        const screenSizeInput = document.getElementById('screen-size');
        const btnApplySize = document.getElementById('btn-apply-size');
        const radiosAccuracy = document.getElementsByName('accuracy');
        const unitBtns = document.querySelectorAll('.unit-btn');

        // --- Fullscreen Elements ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const iconExpand = document.querySelector('.icon-expand');
        const iconCompress = document.querySelector('.icon-compress');

        // --- Core Calculations ---
        function updatePPI() {
            if (state.mode === 'web') {
                state.ppi = 96;
            } else {
                // Kalkulasi PPI fisik berdasarkan resolusi layar penuh (window.screen) dan ukuran inci
                const screenW = window.screen.width * (window.devicePixelRatio || 1);
                const screenH = window.screen.height * (window.devicePixelRatio || 1);
                const diagonalPixels = Math.sqrt(screenW * screenW + screenH * screenH);
                state.ppi = diagonalPixels / state.diagonalInches;
            }
            drawAll();
        }

        function pxToUnit(px) {
            if (state.unit === 'px') return px;
            const inches = px / state.ppi;
            if (state.unit === 'inch') return inches;
            return inches * 2.54; // ke CM
        }

        function formatVal(val) {
            if (state.unit === 'px') return Math.round(val);
            return val.toFixed(2);
        }

        function getUnitLabel() {
            return state.unit === 'inch' ? 'in' : state.unit;
        }

        // Setup Canvas untuk High DPI / Retina
        function setupCanvas(canvas, ctx, isMeasureCanvas = false) {
            const dpr = window.devicePixelRatio || 1;
            const rect = isMeasureCanvas ? {width: window.innerWidth, height: window.innerHeight} : canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            return { width: rect.width, height: rect.height };
        }

        // --- Drawing Logic ---
        function drawAll() {
            drawRulers();
            drawMeasurement();
        }

        function drawRulers() {
            const dimTop = setupCanvas(canvasTop, ctxTop);
            const dimLeft = setupCanvas(canvasLeft, ctxLeft);
            
            const rulerSize = 40; // Lebar penggaris (40px)
            
            const tickColor = '#94a3b8'; // Slate 400
            const fontColor = '#cbd5e1'; // Slate 300
            const bgColor = '#1e293b'; // Slate 800

            // Gambar Background Penggaris
            ctxTop.fillStyle = bgColor;
            ctxTop.fillRect(0, 0, dimTop.width, rulerSize);
            
            ctxLeft.fillStyle = bgColor;
            ctxLeft.fillRect(0, 0, rulerSize, dimLeft.height);

            // Setup Font
            ctxTop.fillStyle = fontColor;
            ctxTop.strokeStyle = tickColor;
            ctxTop.font = '10px monospace';
            ctxTop.textBaseline = 'top';

            ctxLeft.fillStyle = fontColor;
            ctxLeft.strokeStyle = tickColor;
            ctxLeft.font = '10px monospace';
            ctxLeft.textAlign = 'right';
            ctxLeft.textBaseline = 'middle';

            // Menghitung interval jarak garis
            let pxPerUnit = state.ppi; 
            let subdivisions = 8; 

            if (state.unit === 'cm') {
                pxPerUnit = state.ppi / 2.54; 
                subdivisions = 10; 
            } else if (state.unit === 'px') {
                pxPerUnit = 100; 
                subdivisions = 10; 
            }

            const pxPerTick = pxPerUnit / subdivisions;

            // --- Gambar Penggaris Atas ---
            ctxTop.beginPath();
            for (let i = 0; i * pxPerTick <= dimTop.width; i++) {
                let x = i * pxPerTick;
                let isMain = i % subdivisions === 0;
                let isHalf = i % (subdivisions / 2) === 0 && !isMain;

                let lineH = isMain ? rulerSize : (isHalf ? rulerSize * 0.5 : rulerSize * 0.25);

                ctxTop.moveTo(x, rulerSize);
                ctxTop.lineTo(x, rulerSize - lineH);

                if (isMain) {
                    let val = (i / subdivisions) * (state.unit === 'px' ? 100 : 1);
                    ctxTop.fillText(val, x + 3, 4);
                }
            }
            ctxTop.stroke();

            // --- Gambar Penggaris Kiri ---
            ctxLeft.beginPath();
            for (let i = 0; i * pxPerTick <= dimLeft.height; i++) {
                let y = i * pxPerTick;
                let isMain = i % subdivisions === 0;
                let isHalf = i % (subdivisions / 2) === 0 && !isMain;

                let lineW = isMain ? rulerSize : (isHalf ? rulerSize * 0.5 : rulerSize * 0.25);

                ctxLeft.moveTo(rulerSize, y);
                ctxLeft.lineTo(rulerSize - lineW, y);

                if (isMain && y > rulerSize) { 
                    let val = (i / subdivisions) * (state.unit === 'px' ? 100 : 1);
                    
                    ctxLeft.save();
                    ctxLeft.translate(12, y);
                    ctxLeft.rotate(-Math.PI / 2);
                    ctxLeft.textAlign = 'center';
                    ctxLeft.fillText(val, 0, 0);
                    ctxLeft.restore();
                }
            }
            ctxLeft.stroke();

            // Area pojok kiri atas (Kotak Kosong)
            ctxTop.fillStyle = '#0f172a'; 
            ctxTop.fillRect(0, 0, rulerSize, rulerSize);
            ctxTop.strokeStyle = '#334155';
            ctxTop.strokeRect(0, 0, rulerSize, rulerSize);
            ctxTop.beginPath();
            ctxTop.moveTo(0,0);
            ctxTop.lineTo(rulerSize, rulerSize);
            ctxTop.stroke();
        }

        function drawMeasurement() {
            const dim = setupCanvas(measureCanvas, ctxMeasure, true);
            ctxMeasure.clearRect(0, 0, dim.width, dim.height);

            if (!state.isMeasuring && (state.measureStart.x === state.measureEnd.x && state.measureStart.y === state.measureEnd.y)) {
                return;
            }

            const x = Math.min(state.measureStart.x, state.measureEnd.x);
            const y = Math.min(state.measureStart.y, state.measureEnd.y);
            const w = Math.abs(state.measureEnd.x - state.measureStart.x);
            const h = Math.abs(state.measureEnd.y - state.measureStart.y);

            if (w < 2 && h < 2) return;

            // Kotak Seleksi
            ctxMeasure.fillStyle = 'rgba(2, 132, 199, 0.15)'; // Sky 600
            ctxMeasure.fillRect(x, y, w, h);
            ctxMeasure.strokeStyle = '#38bdf8'; // Sky 400
            ctxMeasure.lineWidth = 1.5;
            ctxMeasure.strokeRect(x, y, w, h);

            const valW = formatVal(pxToUnit(w));
            const valH = formatVal(pxToUnit(h));
            const diagPx = Math.sqrt(w*w + h*h);
            const valDiag = formatVal(pxToUnit(diagPx));
            const unitLbl = getUnitLabel();

            const cx = x + w / 2;
            const cy = y + h / 2;

            ctxMeasure.font = '12px Inter, sans-serif';
            ctxMeasure.textAlign = 'center';
            ctxMeasure.textBaseline = 'middle';
            
            const text = `W: ${valW}${unitLbl}  H: ${valH}${unitLbl}`;
            const text2 = `Diag: ${valDiag}${unitLbl}`;
            
            // Background label
            ctxMeasure.fillStyle = 'rgba(15, 23, 42, 0.85)';
            const padding = 6;
            const textW = Math.max(ctxMeasure.measureText(text).width, ctxMeasure.measureText(text2).width);
            ctxMeasure.roundRect(cx - textW/2 - padding, cy - 18 - padding, textW + padding*2, 36 + padding*2, 6);
            ctxMeasure.fill();
            ctxMeasure.strokeStyle = '#334155';
            ctxMeasure.stroke();

            ctxMeasure.fillStyle = '#f8fafc';
            ctxMeasure.fillText(text, cx, cy - 8);
            ctxMeasure.fillStyle = '#94a3b8';
            ctxMeasure.fillText(text2, cx, cy + 8);

            // Garis Diagonal
            ctxMeasure.beginPath();
            ctxMeasure.moveTo(state.measureStart.x, state.measureStart.y);
            ctxMeasure.lineTo(state.measureEnd.x, state.measureEnd.y);
            ctxMeasure.strokeStyle = 'rgba(56, 189, 248, 0.5)';
            ctxMeasure.setLineDash([5, 5]);
            ctxMeasure.stroke();
            ctxMeasure.setLineDash([]);
        }

        // --- Event Listeners ---

        // Resize Layar / Orientasi berubah (Penting jika Fullscreen diubah)
        window.addEventListener('resize', () => {
            // Beri sedikit jeda agar dimensi window benar-benar update
            setTimeout(() => {
                updatePPI(); // PPI bisa berubah kalau orientasi HP berubah
                drawAll();
            }, 100);
        });

        // Pelacak Mouse (Crosshair)
        function handleMove(clientX, clientY) {
            trackerX.style.left = clientX + 'px';
            trackerY.style.top = clientY + 'px';
            
            coordLabel.style.display = 'block';
            coordLabel.style.left = clientX + 'px';
            coordLabel.style.top = clientY + 'px';

            const xVal = formatVal(pxToUnit(clientX - 40)); 
            const yVal = formatVal(pxToUnit(clientY - 40));
            coordLabel.innerText = `X:${xVal} Y:${yVal} ${getUnitLabel()}`;

            if (state.isMeasuring) {
                state.measureEnd = { x: clientX, y: clientY };
                drawMeasurement();
            }
        }

        // Mouse Events
        window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseout', () => coordLabel.style.display = 'none');

        // Touch Events untuk Mobile/Tablet
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false }); // Biarkan passive false agar bisa cegah scroll jika perlu

        function startMeasure(clientX, clientY) {
            state.isMeasuring = true;
            state.measureStart = { x: clientX, y: clientY };
            state.measureEnd = { x: clientX, y: clientY };
            instructionBg.style.opacity = '0'; 
            drawMeasurement();
        }

        measureCanvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            startMeasure(e.clientX, e.clientY);
        });

        measureCanvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                startMeasure(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('mouseup', () => state.isMeasuring = false);
        window.addEventListener('touchend', () => {
            state.isMeasuring = false;
            coordLabel.style.display = 'none'; // Sembunyikan label saat touch lepas
        });


        // --- Fullscreen Logic ---
        function toggleFullScreen() {
            if (!document.fullscreenElement &&    // standard
                !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {  // fallbacks
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // Event listener saat mode fullscreen berubah (oleh tombol kita atau Esc keyboard)
        function handleFullscreenChange() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            if (isFull) {
                iconExpand.classList.add('hidden');
                iconCompress.classList.remove('hidden');
            } else {
                iconExpand.classList.remove('hidden');
                iconCompress.classList.add('hidden');
            }
            // Gambar ulang karena dimensi layar berubah drastis
            setTimeout(drawAll, 200);
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        btnFullscreen.addEventListener('click', toggleFullScreen);


        // --- Panel Control Events ---
        let isDraggingPanel = false;
        let dragOffset = { x: 0, y: 0 };

        function startPanelDrag(clientX, clientY) {
            isDraggingPanel = true;
            const rect = panel.getBoundingClientRect();
            dragOffset.x = clientX - rect.left;
            dragOffset.y = clientY - rect.top;
            panel.style.transition = 'none';
        }

        function doPanelDrag(clientX, clientY) {
            if (isDraggingPanel) {
                let newX = clientX - dragOffset.x;
                let newY = clientY - dragOffset.y;
                newX = Math.max(0, Math.min(newX, window.innerWidth - panel.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - panel.offsetHeight));
                panel.style.left = newX + 'px';
                panel.style.top = newY + 'px';
            }
        }

        function endPanelDrag() {
            if(isDraggingPanel) {
                isDraggingPanel = false;
                panel.style.transition = 'all 0.3s ease';
            }
        }

        // Panel Drag - Mouse
        panelHeader.addEventListener('mousedown', (e) => startPanelDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => doPanelDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', endPanelDrag);

        // Panel Drag - Touch
        panelHeader.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) startPanelDrag(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault(); // Cegah scroll saat menarik panel
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) doPanelDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        window.addEventListener('touchend', endPanelDrag);

        // Mencegah interaksi dalam panel memicu fungsi ukur kanvas
        panel.addEventListener('mousedown', (e) => e.stopPropagation());
        panel.addEventListener('touchstart', (e) => e.stopPropagation(), {passive: true});

        // Tombol Minimize
        btnMinimize.addEventListener('click', () => {
            if (panelContent.style.display === 'none') {
                panelContent.style.display = 'flex';
                btnMinimize.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';
            } else {
                panelContent.style.display = 'none';
                btnMinimize.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 15l-7-7-7 7"></path></svg>';
            }
        });

        // Pilihan Satuan
        unitBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                state.unit = e.target.dataset.unit;
                unitBtns.forEach(b => {
                    b.className = "unit-btn flex-1 py-1.5 px-2 text-slate-400 hover:text-slate-200 rounded-md text-xs font-medium transition";
                });
                e.target.className = "unit-btn flex-1 py-1.5 px-2 bg-slate-700 text-white rounded-md text-xs font-medium transition shadow-sm";
                drawAll();
            });
        });

        // Mode Akurasi
        radiosAccuracy.forEach(radio => {
            radio.addEventListener('change', (e) => {
                state.mode = e.target.value;
                if (state.mode === 'physical') {
                    physicalInputs.classList.remove('opacity-50', 'pointer-events-none');
                } else {
                    physicalInputs.classList.add('opacity-50', 'pointer-events-none');
                }
                updatePPI();
            });
        });

        // Terapkan Ukuran Monitor
        btnApplySize.addEventListener('click', () => {
            const val = parseFloat(screenSizeInput.value);
            if (val && val > 0) {
                state.diagonalInches = val;
                updatePPI();
                
                const oriText = btnApplySize.innerText;
                btnApplySize.innerText = '✓ Diterapkan';
                btnApplySize.classList.replace('bg-sky-600', 'bg-emerald-600');
                setTimeout(() => {
                    btnApplySize.innerText = oriText;
                    btnApplySize.classList.replace('bg-emerald-600', 'bg-sky-600');
                }, 1500);
            }
        });

        // Polyfill untuk RoundRect
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            }
        }

        // --- Inisialisasi ---
        updatePPI();

    </script>
</body>
</html>
